<!DOCTYPE html>
<html>
<head>
  <title>AI Job Simulator</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://ai-job-simulator-backend.onrender.com/socket.io/socket.io.js"></script>
  <script src="config.js"></script>

</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <h2>AI Job Simulator</h2>
      <nav>
        <a data-page="dashboard" href="#" onclick="router.navigate('dashboard'); return false;"><span>▦</span>Dashboard</a>
        <a data-page="scenarios" href="#" onclick="router.navigate('scenarios'); return false;"><span>◈</span>Scenarios</a>
        <a data-page="levels" href="#" onclick="router.navigate('levels'); return false;"><span>⬆</span>Levels</a>
        <a data-page="progress" href="#" onclick="router.navigate('progress'); return false;"><span>↗</span>Progress</a>
        <a data-page="achievements" href="#" onclick="router.navigate('achievements'); return false;"><span>✦</span>Achievements</a>
        <a data-page="settings" href="#" onclick="router.navigate('settings'); return false;"><span>⚙</span>Settings</a>
        <a data-page="help" href="#" onclick="router.navigate('help'); return false;"><span>?</span>Help</a>
        <a data-page="logout" href="#" onclick="logout(); return false;"><span>↪</span>Logout</a>
      </nav>
      <div class="sidebar-footer">
        <div class="backend-status" id="backendStatus" role="status" aria-live="polite">
          <span class="backend-status-dot" aria-hidden="true"></span>
          <span class="backend-status-label">Connecting to coach...</span>
        </div>
        <button class="theme-toggle sidebar-theme-toggle" type="button" onclick="toggleTheme()" aria-label="Toggle colour theme">
          <span class="theme-icon">☾</span><span class="theme-toggle-label">Dark mode</span>
        </button>
      </div>
    </aside>
    <main>
      <div id="main-content"><p>Loading...</p></div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
