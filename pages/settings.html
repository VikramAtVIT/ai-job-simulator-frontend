<div class="content-page settings-page">
    <div class="header">
        <h1>Settings</h1>
    </div>
    <div class="settings-grid">
      <section class="content-card settings-card">
        <span class="eyebrow">Personalise your practice</span>
        <h2>Experience settings</h2>
        <p>Make the simulator feel right for the way you learn. Changes are saved on this device.</p>
        <label class="setting-row">
          <span><strong>Light mode</strong><small>Use a bright, high-contrast workspace.</small></span>
          <input class="switch-input" id="lightModeToggle" type="checkbox" onchange="setTheme(this.checked ? 'light' : 'dark')">
          <span class="switch"></span>
        </label>
        <label class="setting-row">
          <span><strong>Show hard scenarios</strong><small>Hard scenarios unlock automatically at Advanced level.</small></span>
          <input class="switch-input" id="hardScenariosToggle" type="checkbox" onchange="setPreference('hardScenarios', this.checked)">
          <span class="switch"></span>
        </label>

      </section>
      <section class="content-card settings-card account-settings">
        <span class="eyebrow">Account</span>
        <h2>Profile and access</h2>
        <p id="settingsAccountText">Your profile and practice history are securely linked to your account.</p>
        <button class="btn-primary" type="button" onclick="handleLogout()">Log out</button>
      </section>
    </div>
</div>
