<section id="achievementsPage" class="achievements-page">
  <header class="page-heading">
    <span class="eyebrow">Milestones · earned through practice</span>
    <h1>Achievements 🏆</h1>
    <p>Track your progress across practice, consistency, mastery, and performance. Each badge unlocks only when its displayed criteria are met.</p>
  </header>

  <section class="achievements-container" aria-labelledby="achievementCount">
    <div class="achievements-header">
      <div class="achievement-count">
        <div class="count-number" id="achievementCount" aria-live="polite">0/12</div>
        <div class="count-label">Achievements earned</div>
      </div>
      <div class="achievement-progress">
        <div class="progress-bar-outer" role="progressbar" aria-label="Overall achievement progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-bar-inner" style="width:0%"></div>
        </div>
        <span>0% complete</span>
      </div>
    </div>
    <div class="achievements-grid" aria-live="polite"></div>
  </section>
</section>
